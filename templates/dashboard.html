<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GazelleSignals</title>
<style>
body{background:#0a0e14;color:white;font-family:sans-serif;margin:0;padding:10px}
.card{background:#151a23;border-radius:12px;padding:15px;margin:10px 0;border:1px solid #222}
.buy{color:#00ff88;font-weight:bold}
.sell{color:#ff4444;font-weight:bold}
.btn{background:#4a9eff;color:white;border:none;padding:12px 20px;border-radius:10px;width:100%;font-size:16px}
.lock{filter:blur(5px);opacity:0.5}
.badge{padding:4px 10px;border-radius:20px;font-size:12px}
.free{background:#333} .vip{background:gold;color:black}
</style>
</head>
<body>
<div style="display:flex;justify-content:space-between;align-items:center">
<h2>🦌 GazelleSignals</h2>
<span class="badge {{ 'vip' if user.tier=='VIP' else 'free' }}">{{ user.tier }}</span>
</div>
<p>Welcome {{ user.email }} | <a href="/logout" style="color:#aaa">Logout</a></p>

{% if upgrade_mode %}
<div class="card" style="text-align:center">
<h3>Upgrade to VIP - $10</h3>
<p>Unlock Gold, Crypto + All Signals</p>
<button class="btn" onclick="pay()">Pay with Flutterwave</button>
</div>
{% endif %}

<h3>Live Signals</h3>
