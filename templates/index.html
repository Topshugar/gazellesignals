<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gazelle Signals - Login</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm bg-[#111] rounded-2xl p-6 border border-zinc-800">

    <div class="bg-[#00FF88] text-black text-center text-sm font-bold py-2.5 rounded-lg mb-6">
      🚀 Telegram Bot Coming Soon - VIP $10 via Flutterwave
    </div>

    <h1 class="text-center text-[#00FF88] text-xl font-bold tracking-widest mb-6">GAZELLE SIGNALS</h1>

    <div class="flex mb-6">
      <a href="/login" class="flex-1 text-center pb-2 border-b-2 border-[#00FF88] text-[#00FF88] text-sm">Login</a>
      <a href="/register" class="flex-1 text-center pb-2 border-b border-zinc-700 text-zinc-400 text-sm">Register</a>
    </div>

    <form method="POST" action="/login" class="space-y-4">
      <input type="email" name="email" placeholder="Email" required
        class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-3 text-white placeholder-zinc-500 text-sm focus:outline-none focus:border-[#00FF88]">

      <input type="password" name="password" placeholder="Password" required
        class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-3 text-white placeholder-zinc-500 text-sm focus:outline-none focus:border-[#00FF88]">

      <button type="submit"
        class="w-full bg-[#00FF88] text-black font-bold py-3 rounded-lg text-sm hover:bg-[#00e67a]">
        Login
      </button>
    </form>

    <p class="text-center text-zinc-500 text-[11px] mt-6 tracking-widest">
      MT5 Pro Signals | H4/D1 + M5/M15/M30
    </p>
  </div>
</body>
</html>
