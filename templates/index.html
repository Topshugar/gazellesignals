<!DOCTYPE html>
<html>
<head>
<title>Gazelle Signals - Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:monospace}
body{background:#0a0e14;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh}
.card{background:#151a23;padding:30px;border-radius:10px;width:90%;max-width:400px;border:1px solid #1e252f}
h2{color:#00ff88;text-align:center;margin-bottom:20px}
input{width:100%;padding:12px;margin:8px 0;background:#0a0e14;border:1px solid #1e252f;color:#fff;border-radius:6px}
button{width:100%;padding:12px;background:#00ff88;color:#000;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:10px}
.tabs{display:flex;margin-bottom:20px}
.tab{flex:1;padding:10px;text-align:center;cursor:pointer;border-bottom:2px solid transparent}
.tab.active{border-bottom-color:#00ff88;color:#00ff88}
.form{display:none}
.form.active{display:block}
small{color:#888;display:block;text-align:center;margin-top:15px}
.coming{width:100%;padding:12px;background:gray;color:#fff;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:15px}
</style>
</head>
<body>
<div class="card">
<div style="background:#00ff88; color:#000; padding:10px; text-align:center; margin-bottom:15px; font-weight:bold; border-radius:5px;">
🚀 Telegram Bot Coming Soon - VIP $10 via Flutterwave
</div>
<h2>GAZELLE SIGNALS</h2>
<div class="tabs">
<div class="tab active" onclick="show('login')">Login</div>
<div class="tab" onclick="show('register')">Register</div>
</div>
<div id="login" class="form active">
<form method="POST" action="/login">
<input name="email" placeholder="Email" required>
<input name="password" type="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
</div>
<div id="register" class="form">
<form method="POST" action="/register">
<input name="email" placeholder="Email" required>
<input name="password" type="password" placeholder="Password" required>
<button type="submit">Create Account</button>
</form>
</div>

<button type="button" class="coming" onclick="alert('Telegram bot coming soon! VIP $10/month via Flutterwave - stay tuned!')">Join Telegram - Coming Soon</button>

<small>MT5 Pro Signals | H4/D1 + M5/M15/M30</small>
</div>
<script>
function show(id){
 document.querySelectorAll('.form').forEach(f=>f.classList.remove('active'));
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 event.target.classList.add('active');
}
</script>
</body>
 </html>
